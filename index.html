<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDVision</title>
<style>
:root{color-scheme:light dark}body{font:16px system-ui,sans-serif;max-width:1080px;margin:2rem auto;padding:0 1rem}
button,input,select{font:inherit}button{cursor:pointer;padding:.6rem .9rem}input[type=text]{width:100%;box-sizing:border-box;padding:.55rem}
label{display:block;margin:.8rem 0}canvas{max-width:100%;height:auto;border:1px solid #888}
.row{display:flex;flex-wrap:wrap;gap:1.5rem}.column{flex:1 1 320px;min-width:0}.card-image{max-width:100%;max-height:340px;object-fit:contain}
.portrait{max-width:180px;max-height:180px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#8882;padding:1rem;min-height:2rem}
.error{color:#e55}.muted{opacity:.75}fieldset{border:1px solid #888;border-radius:8px}section{margin-top:1.5rem}
</style><script src="/app.js" defer></script>
</head>
<body>
<h1>IDVision</h1>
<p>Card detection uses your configured Roboflow workflow. OCR and portrait detection run on this app's backend.</p>
<form id="upload-form">
<label>Choose an ID-card image <input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></label>
<button type="submit">Detect and extract</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section id="results" hidden>
<div class="row">
<div class="column"><h2>Detection</h2><canvas id="preview" aria-label="Uploaded image with detection boxes"></canvas>
<label>Card to review <select id="card-choice"></select></label><p id="confidence" class="muted"></p></div>
<div class="column"><h2>Detected card crop</h2><img id="crop" class="card-image" alt="Actual detected card crop">
<h2>Detected portrait</h2><img id="portrait" class="portrait" alt="Detected portrait" hidden><p id="no-portrait" hidden>No portrait detected.</p></div>
</div>
<fieldset><legend>Review and edit fields</legend>
<label>Full name <input id="full_name" type="text"></label>
<label>Document number <input id="document_number" type="text"></label>
<label>Date of birth <input id="date_of_birth" type="text"></label>
<label>Expiry date <input id="expiry_date" type="text"></label>
</fieldset>
<h2>Raw OCR text</h2><p id="ocr-confidence" class="muted"></p><pre id="ocr-text"></pre>
<button id="json-export" type="button">Export JSON</button> <button id="csv-export" type="button">Export CSV</button>
</section>
</body></html>
